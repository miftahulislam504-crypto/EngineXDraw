<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="512" y2="512" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#182541"/>
      <stop offset="1" stop-color="#0E1526"/>
    </linearGradient>
    <linearGradient id="accent" x1="120" y1="120" x2="392" y2="392" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#4F8BFF"/>
      <stop offset="1" stop-color="#2D6CDF"/>
    </linearGradient>
    <clipPath id="clip"><rect width="512" height="512" rx="112"/></clipPath>
  </defs>

  <!-- background: deep ink navy, matching the app's ink color token -->
  <rect width="512" height="512" rx="112" fill="url(#bg)"/>

  <!-- faint blueprint grid, cropped to the rounded square -->
  <g clip-path="url(#clip)" opacity="0.16">
    <g stroke="#4F8BFF" stroke-width="1.5">
      <line x1="0" y1="96"  x2="512" y2="96"/>
      <line x1="0" y1="176" x2="512" y2="176"/>
      <line x1="0" y1="256" x2="512" y2="256"/>
      <line x1="0" y1="336" x2="512" y2="336"/>
      <line x1="0" y1="416" x2="512" y2="416"/>
      <line x1="96"  y1="0" x2="96"  y2="512"/>
      <line x1="176" y1="0" x2="176" y2="512"/>
      <line x1="256" y1="0" x2="256" y2="512"/>
      <line x1="336" y1="0" x2="336" y2="512"/>
      <line x1="416" y1="0" x2="416" y2="512"/>
    </g>
  </g>

  <!-- signature mark: a drafted plan-corner (outer wall + dimension
       line, like the corner of an architectural floor plan) resolving
       into a bold geometric "E" for EngineX / EngineXDraw. Reads as
       both a plan drawing AND a wordmark initial at any size, down to
       a 16px favicon. -->
  <g transform="translate(256 250)">
    <!-- drafted corner strokes (blueprint dimension lines), set back
         from the E so they read as a distinct drafting frame rather
         than colliding with the letterform -->
    <path d="M -120 -120 L 120 -120" stroke="url(#accent)" stroke-width="12" stroke-linecap="round" fill="none" opacity="0.5"/>
    <path d="M -120 -120 L -120 120" stroke="url(#accent)" stroke-width="12" stroke-linecap="round" fill="none" opacity="0.5"/>
    <!-- drafting-compass registration point at the corner -->
    <circle cx="-120" cy="-120" r="10" fill="#F6F7F9"/>

    <!-- solid E-plan mark, centered -->
    <path d="
      M -66 -84
      H 76
      V -32
      H -14
      V -8
      H 60
      V 40
      H -14
      V 64
      H 76
      V 116
      H -66
      Z"
      fill="url(#accent)"/>
  </g>
</svg>
